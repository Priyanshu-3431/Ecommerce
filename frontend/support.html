<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support | ShopVerse</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/api.js"></script><script defer src="/js/common.js"></script></head><body><div id="siteHeader"></div><main class="page"><div class="details"><section class="panel"><h1>Help & Support</h1><form id="f"><label class="field">Subject<input id="subject" required></label><label class="field">Category<select id="category"><option>Orders</option><option>Payment</option><option>Returns</option><option>Account</option><option>Delivery</option><option>General</option></select></label><label class="field">Message<textarea id="message" required></textarea></label><button class="btn brand">Create Ticket</button></form></section><section class="panel"><h2>My Tickets</h2><div id="tickets"></div></section></div></main><script>document.addEventListener('DOMContentLoaded',load);async function load(){if(!API.token)return location.href='/login.html?next=/support.html';try{const d=await API.call('/commerce/support');tickets.innerHTML=d.map(x=>`<div class="panel" style="margin:9px 0"><b>${x.ticketNumber} · ${x.subject}</b><p><span class="status">${x.status}</span></p><p>${x.messages.map(m=>`<b>${m.role}:</b> ${m.message}`).join('<br>')}</p><button class="btn secondary" onclick="reply('${x._id}')">Reply</button></div>`).join('')||'<p>No tickets.</p>'}catch(e){toast(e.message)}}f.onsubmit=async e=>{e.preventDefault();await API.call('/commerce/support',{method:'POST',body:JSON.stringify({subject:subject.value,category:category.value,message:message.value})});f.reset();toast('Ticket created');load()};async function reply(id){const message=prompt('Reply');if(message){await API.call('/commerce/support/'+id+'/reply',{method:'POST',body:JSON.stringify({message})});load()}}</script><div class="toast"></div></body></html>
