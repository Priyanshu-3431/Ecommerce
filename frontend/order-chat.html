<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Support | ShopVerse</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/customer.css"><script defer src="/js/api.js"></script><script defer src="/js/common.js"></script></head><body><div id="siteHeader"></div><main class="order-support-shell"><section class="chat-card order-support-chat"><header class="chat-top order-chat-head"><div><a id="backOrder" class="back-link" href="/orders.html">← Order details</a><h1>Order Support</h1><p id="chatOrderMeta">Loading order…</p></div><div class="order-support-actions"><a id="callSupport" class="btn secondary disabled" href="#">📞 Call Support</a><button class="btn secondary" type="button" onclick="openRefundPanel('REFUND')">₹ Request Refund</button></div></header><div id="orderContext" class="order-context-strip"></div><div id="chatMessages" class="chat-messages"></div><div id="starter" class="chat-starter"><p>What do you need help with?</p><div class="quick-chips"><button onclick="quick('Where is my order?')">Where is my order?</button><button onclick="quick('I want to cancel this order')">Cancel order</button><button onclick="quick('I have a payment issue')">Payment issue</button><button onclick="openRefundPanel('RETURN')">Return item</button><button onclick="openRefundPanel('REPLACE')">Replace item</button><button onclick="openRefundPanel('REFUND')">Request refund</button></div></div><form id="chatForm" class="chat-compose"><textarea id="chatInput" rows="1" maxlength="3000" placeholder="Type a message about this order…"></textarea><button class="send-btn" type="submit">Send</button></form></section><aside class="premium-card refund-side" id="refundPanel"><div class="section-title"><div><span class="eyebrow">ORDER RESOLUTION</span><h2>Return / Refund</h2></div></div><div id="requestStatus" class="request-status"></div><form id="refundForm"><label>Request type<select id="refundType" class="support-select"><option value="REFUND">Refund</option><option value="RETURN">Return</option><option value="REPLACE">Replacement</option></select></label><label>Reason<select id="refundReason" class="support-select"><option>Product damaged</option><option>Wrong product received</option><option>Missing item/accessory</option><option>Product not as described</option><option>Quality issue</option><option>Changed my mind</option><option>Other</option></select></label><label>Details<textarea id="refundDetails" rows="4" maxlength="1200" placeholder="Tell us what happened…"></textarea></label><button class="btn brand" type="submit">Submit request</button><p class="muted refund-note">Refund approval is handled by Admin. Online-paid orders can be refunded to the original payment method after approval.</p></form></aside></main><div class="toast"></div><script>
let orderId,ticketId,currentOrder;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.addEventListener('DOMContentLoaded',init);async function init(){if(!API.token)return location.href='/login.html';orderId=new URLSearchParams(location.search).get('order');if(!orderId)return location.href='/orders.html';chatForm.addEventListener('submit',send);refundForm.addEventListener('submit',submitRequest);chatInput.addEventListener('input',()=>{chatInput.style.height='auto';chatInput.style.height=Math.min(chatInput.scrollHeight,120)+'px'});await Promise.all([refresh(),loadCall(),loadRequest()]);setInterval(()=>{if(!document.hidden)refresh(false)},8000)}
async function loadCall(){try{const d=await API.call('/commerce/support-config');if(d.callEnabled){callSupport.href='tel:'+d.supportPhone;callSupport.classList.remove('disabled');callSupport.title='Call ShopVerse support'}else{callSupport.onclick=e=>{e.preventDefault();toast('Support phone is not configured yet. Admin can set SUPPORT_PHONE in backend/.env')}}}catch(e){callSupport.onclick=x=>{x.preventDefault();toast('Call support is temporarily unavailable')}}}
async function refresh(scroll=true){try{const d=await API.call('/commerce/order-chat/'+orderId);currentOrder=d.order;backOrder.href='/order-details.html?id='+orderId;chatOrderMeta.textContent=`Order ${d.order.orderNumber} · ${d.order.status} · ${money(d.order.total)}`;ticketId=d.ticket?._id||null;orderContext.innerHTML=`<div><b>${esc(d.order.orderNumber)}</b><span>${esc(d.order.status)}</span></div><div><span>Payment</span><b>${esc(d.order.paymentMethod)} · ${esc(d.order.paymentStatus)}</b></div><div><span>Items</span><b>${d.order.items?.length||0}</b></div><div><span>Total</span><b>${money(d.order.total)}</b></div>`;render(d.ticket?.messages||[]);starter.style.display=d.ticket?'none':'block';if(scroll)chatMessages.scrollTop=chatMessages.scrollHeight}catch(e){toast(e.message)}}
function render(msgs){chatMessages.innerHTML=msgs.length?msgs.map(m=>{const mine=m.role==='customer'||m.role==='user';const who=mine?'You':'ShopVerse Admin';return `<div class="bubble-row ${mine?'mine':'theirs'}"><div class="bubble"><div class="bubble-who">${who}</div><div>${esc(m.message)}</div><time>${new Date(m.at).toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'short'})}</time></div></div>`}).join(''):`<div class="chat-empty"><div class="support-avatar">SV</div><h3>Chat about ${esc(currentOrder?.orderNumber||'this order')}</h3><p>This is a private support thread linked only to your order. Admin can see your name, Order ID and order context.</p></div>`}
function quick(t){chatInput.value=t;chatInput.focus()}
async function send(e){e?.preventDefault();const message=chatInput.value.trim();if(!message)return;const btn=chatForm.querySelector('button');btn.disabled=true;try{if(ticketId)await API.call('/commerce/support/'+ticketId+'/reply',{method:'POST',body:JSON.stringify({message})});else{const t=await API.call('/commerce/support',{method:'POST',body:JSON.stringify({orderId,message,subject:'Order support',category:'Order'})});ticketId=t._id}chatInput.value='';chatInput.style.height='auto';await refresh()}catch(e){toast(e.message)}finally{btn.disabled=false}}
function openRefundPanel(type){refundType.value=type;refundPanel.scrollIntoView({behavior:'smooth',block:'center'});refundDetails.focus()}
async function loadRequest(){try{const rows=await API.call('/commerce/returns');const r=rows.find(x=>String(x.order?._id||x.order)===String(orderId));requestStatus.innerHTML=r?`<div class="active-request"><b>${esc(r.type)} request</b><span class="status-pill">${esc(r.status)}</span><p>${esc(r.reason||'')}</p></div>`:'<p class="muted">No active return/refund request for this order.</p>';if(r&&!['REJECTED','REFUNDED','REPLACED'].includes(r.status)){refundForm.querySelector('button').disabled=true;refundForm.querySelector('button').textContent='Request already submitted'}}catch(e){requestStatus.innerHTML='<p class="muted">Request status unavailable.</p>'}}
async function submitRequest(e){e.preventDefault();const type=refundType.value,reason=refundReason.value,details=refundDetails.value.trim();if(!confirm(`Submit ${type.toLowerCase()} request for ${currentOrder?.orderNumber||'this order'}?`))return;const btn=e.submitter;btn.disabled=true;try{await API.call('/commerce/returns',{method:'POST',body:JSON.stringify({orderId,type,reason,details})});toast(type==='REFUND'?'Refund request submitted':'Request submitted');quick(`I submitted a ${type.toLowerCase()} request for this order. Please review it.`);await loadRequest();await send()}catch(e){toast(e.message);btn.disabled=false}}
</script></body></html>
