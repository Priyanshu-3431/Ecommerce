<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Details | ShopVerse</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/customer.css"><script defer src="/js/api.js"></script><script defer src="/js/common.js"></script></head><body><div id="siteHeader"></div><main class="customer-shell"><div class="customer-head"><div><a href="/orders.html" class="back-link">← My Orders</a><h1>Order details</h1><p id="orderMeta" class="muted"></p></div><a id="chatBtn" class="btn brand" href="#">Chat about this order</a></div><div id="orderView"></div></main><div class="toast"></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.addEventListener('DOMContentLoaded',loadOrder);
async function loadOrder(){if(!API.token)return location.href='/login.html?next='+encodeURIComponent(location.pathname+location.search);const id=new URLSearchParams(location.search).get('id');if(!id)return location.href='/orders.html';try{const o=await API.call('/orders/'+id);orderMeta.textContent=`${o.orderNumber} · Placed ${new Date(o.createdAt).toLocaleString('en-IN')}`;chatBtn.href='/order-chat.html?order='+o._id;const progress=(o.timeline||[]).map((t,i)=>`<div class="timeline-step"><span>${i+1}</span><div><b>${esc(t.status)}</b><small>${new Date(t.at).toLocaleString('en-IN')}</small></div></div>`).join('');orderView.innerHTML=`<div class="order-layout"><section class="premium-card"><div class="section-title"><h2>Items in your order</h2><span class="status-pill">${esc(o.status)}</span></div><div class="ordered-products">${(o.items||[]).map(x=>`<div class="ordered-item"><div class="order-thumb">${esc((x.name||'P').slice(0,1))}</div><div class="grow"><b>${esc(x.name)}</b><p>Quantity: ${x.qty} · ${money(x.price)} each</p></div><strong>${money(x.price*x.qty)}</strong></div>`).join('')}</div><div class="price-summary"><div><span>Subtotal</span><b>${money(o.subtotal)}</b></div><div><span>Discount</span><b>- ${money(o.discount||0)}</b></div><div><span>Shipping</span><b>${money(o.shipping||0)}</b></div><div><span>Tax</span><b>${money(o.tax||0)}</b></div><div class="total"><span>Total</span><b>${money(o.total)}</b></div></div></section><aside class="premium-card"><h2>Delivery & payment</h2><div class="info-block"><b>${esc(o.address?.name||'')}</b><p>${esc(o.address?.line1||'')}<br>${esc(o.address?.city||'')}, ${esc(o.address?.state||'')} ${esc(o.address?.pincode||'')}<br>${esc(o.address?.mobile||'')}</p></div><div class="info-row"><span>Payment</span><b>${esc(o.paymentMethod)} · ${esc(o.paymentStatus)}</b></div>${o.trackingId?`<div class="info-row"><span>Tracking</span><b>${esc(o.courier||'Courier')} · ${esc(o.trackingId)}</b></div>`:''}<h3>Order progress</h3><div class="order-timeline">${progress}</div></aside></div>`}catch(e){toast(e.message)}}
</script></body></html>
