<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | ShopVerse</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/customer.css"><script defer src="/js/api.js"></script><script defer src="/js/common.js"></script></head><body><div id="siteHeader"></div><main class="customer-shell"><section class="profile-hero"><div class="profile-avatar" id="avatar">U</div><div class="grow"><span class="eyebrow">SHOPVERSE MEMBER</span><h1 id="heroName">My Account</h1><p id="heroEmail"></p></div><a href="/orders.html" class="btn brand">My Orders</a></section><div class="account-grid"><aside class="account-nav"><button class="active" data-pane="overview">Overview</button><button data-pane="profile">Personal details</button><button data-pane="addresses">Addresses</button><button data-pane="wallet">Wallet & rewards</button><button data-pane="notifications">Notifications</button><button data-pane="returns">Returns</button><a href="/wishlist.html">Wishlist</a><a href="/order-chat.html" onclick="event.preventDefault();toast('Open chat from a specific order')">Order support</a></aside><section class="account-content"><div id="pane-overview" class="account-pane active"><div id="accountStats" class="mini-stats"></div><div class="premium-card"><div class="section-title"><h2>Recent orders</h2><a href="/orders.html">View all</a></div><div id="recentOrders"></div></div></div><div id="pane-profile" class="account-pane"><div class="premium-card"><h2>Personal details</h2><form id="profileForm" class="profile-form"><label>Full name<input id="pName" required></label><label>Email<input id="pEmail" disabled></label><label>Mobile<input id="pMobile" maxlength="10" inputmode="numeric"></label><button class="btn brand">Save changes</button></form></div></div><div id="pane-addresses" class="account-pane"><div class="premium-card"><div class="section-title"><h2>Saved addresses</h2><button class="btn brand" onclick="addAddress()">+ Add address</button></div><div id="addressList" class="address-grid"></div></div></div><div id="pane-wallet" class="account-pane"><div class="premium-card"><h2>Wallet & rewards</h2><div id="walletView"></div><div class="wallet-actions"><input id="giftCode" placeholder="Gift card code"><button class="btn secondary" onclick="redeemGift()">Redeem gift card</button><input id="points" type="number" min="100" placeholder="Points"><button class="btn secondary" onclick="redeemPoints()">Convert points</button></div></div></div><div id="pane-notifications" class="account-pane"><div class="premium-card"><div class="section-title"><h2>Notifications</h2><button class="btn secondary" onclick="markRead()">Mark all read</button></div><div id="notificationList"></div></div></div><div id="pane-returns" class="account-pane"><div class="premium-card"><h2>Returns & replacements</h2><div id="returnList"></div></div></div></section></div></main><div class="toast"></div><script>
let me,ordersData=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.addEventListener('DOMContentLoaded',load);document.addEventListener('click',e=>{const b=e.target.closest('[data-pane]');if(!b)return;document.querySelectorAll('.account-nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.account-pane').forEach(x=>x.classList.toggle('active',x.id==='pane-'+b.dataset.pane))});
async function load(){if(!API.token)return location.href='/login.html?next=/profile.html';try{[me,ordersData]=await Promise.all([API.call('/user/profile'),API.call('/orders')]);heroName.textContent=me.name||'My Account';heroEmail.textContent=me.email||'';avatar.textContent=(me.name||'U').trim().charAt(0).toUpperCase();pName.value=me.name||'';pEmail.value=me.email||'';pMobile.value=me.mobile||'';accountStats.innerHTML=`<div><b>${ordersData.length}</b><span>Orders</span></div><div><b>${(me.wishlist||[]).length}</b><span>Wishlist</span></div><div><b>${me.loyaltyPoints||0}</b><span>Reward points</span></div><div><b>${money(me.walletBalance||0)}</b><span>Wallet</span></div>`;recentOrders.innerHTML=ordersData.slice(0,4).map(o=>`<a class="recent-order" href="/order-details.html?id=${o._id}"><div><b>${esc(o.orderNumber)}</b><span>${o.items.length} item(s) · ${new Date(o.createdAt).toLocaleDateString('en-IN')}</span></div><div><strong>${money(o.total)}</strong><span class="status-pill">${esc(o.status)}</span></div></a>`).join('')||'<p class="muted">No orders yet.</p>';renderAddresses();const [w,n,r]=await Promise.all([API.call('/commerce/wallet'),API.call('/commerce/notifications'),API.call('/commerce/returns')]);walletView.innerHTML=`<div class="wallet-balance"><span>Available balance</span><b>${money(w.balance)}</b><small>${w.points} reward points</small></div>`;notificationList.innerHTML=n.map(x=>`<div class="notification-item ${x.read?'':'unread'}"><b>${esc(x.title)}</b><p>${esc(x.message)}</p><small>${new Date(x.createdAt).toLocaleString('en-IN')}</small></div>`).join('')||'<p class="muted">No notifications.</p>';returnList.innerHTML=r.map(x=>`<div class="return-card"><b>${esc(x.order?.orderNumber||'Order')} · ${esc(x.type)}</b><span class="status-pill">${esc(x.status)}</span><p>${esc(x.reason)}</p></div>`).join('')||'<p class="muted">No return requests.</p>'}catch(e){toast(e.message)}}
function renderAddresses(){addressList.innerHTML=(me.addresses||[]).map(a=>`<div class="address-card"><div><span class="address-type">${esc(a.type||'Home')}</span><b>${esc(a.name||me.name)}</b><p>${esc(a.line1||'')}<br>${esc(a.city||'')}, ${esc(a.state||'')} ${esc(a.pincode||'')}<br>${esc(a.mobile||'')}</p></div><div style="display:grid;gap:7px">${a.isDefault?'<span class="status-pill">Default</span>':`<button class="btn secondary" onclick="setDefaultAddress('${a._id}')">Set default</button>`}<button class="btn danger" onclick="delAddress('${a._id}')">Delete</button></div></div>`).join('')||'<p class="muted">No saved addresses.</p>'}
profileForm.onsubmit=async e=>{e.preventDefault();try{me=await API.call('/user/profile',{method:'PATCH',body:JSON.stringify({name:pName.value.trim(),mobile:pMobile.value.trim()})});localStorage.setItem('sv_user',JSON.stringify({...(JSON.parse(localStorage.getItem('sv_user')||'{}')),name:me.name,email:me.email,mobile:me.mobile,role:me.role}));toast('Profile updated');load()}catch(e){toast(e.message)}};
async function addAddress(){const wrap=document.createElement('div');wrap.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:9999;padding:16px';wrap.innerHTML=`<div class="premium-card" style="width:min(620px,100%);max-height:90vh;overflow:auto"><div class="section-title"><h2>Add address</h2><button class="btn secondary" id="closeAddr">Close</button></div><p class="muted">Enter PIN code first. ShopVerse will suggest city, state and post office/area.</p><div class="profile-form"><label>PIN code<input id="aPin" inputmode="numeric" maxlength="6" placeholder="6-digit PIN"></label><button class="btn secondary" id="findPin" type="button">Find address</button><div id="aPinStatus" class="muted"></div><label id="areaLabel" style="display:none">Area / Post Office<select id="aOffice"></select></label><label>Receiver name<input id="aName" value="${esc(me.name||'')}"></label><label>Mobile<input id="aMobile" inputmode="numeric" maxlength="10" value="${esc(me.mobile||'')}"></label><label>House / Flat / Street<input id="aLine1"></label><label>Landmark / Area<input id="aLine2"></label><label>City / District<input id="aCity" readonly></label><label>State<input id="aState" readonly></label><button class="btn brand" id="saveAddr" type="button">Save address</button></div></div>`;document.body.appendChild(wrap);let pd=null;const q=id=>wrap.querySelector('#'+id);q('closeAddr').onclick=()=>wrap.remove();wrap.onclick=e=>{if(e.target===wrap)wrap.remove()};async function findPin(){const pin=q('aPin').value.trim();if(!/^[1-9][0-9]{5}$/.test(pin)){q('aPinStatus').textContent='Enter a valid 6-digit Indian PIN code';return}q('aPinStatus').textContent='Checking...';try{pd=await API.call('/advanced/pincode/'+pin);q('aCity').value=pd.city||pd.district||'';q('aState').value=pd.state||'';q('aOffice').innerHTML=pd.offices.map((o,i)=>`<option value="${i}">${esc(o.name)} · ${esc(o.district)}, ${esc(o.state)}</option>`).join('');q('areaLabel').style.display='grid';q('aPinStatus').textContent='✓ Valid PIN code'}catch(e){pd=null;q('aPinStatus').textContent=e.message}}q('findPin').onclick=findPin;q('aPin').oninput=()=>{q('aPin').value=q('aPin').value.replace(/\D/g,'').slice(0,6);if(q('aPin').value.length===6)findPin()};q('aOffice').onchange=()=>{const o=pd?.offices?.[+q('aOffice').value];if(o){q('aCity').value=o.district||pd.city||'';q('aState').value=o.state||pd.state||'';q('aLine2').value=o.name||''}};q('saveAddr').onclick=async()=>{if(!pd||pd.pincode!==q('aPin').value.trim())return toast('Validate PIN code first');const o=pd.offices[+q('aOffice').value]||pd.offices[0];const data={name:q('aName').value.trim(),mobile:q('aMobile').value.trim(),line1:q('aLine1').value.trim(),line2:q('aLine2').value.trim()||o?.name||'',city:q('aCity').value.trim(),state:q('aState').value.trim(),pincode:q('aPin').value.trim(),type:'Home',isDefault:!(me.addresses||[]).length};if(!data.name||!data.line1||!data.city||!data.state||!/^\d{10}$/.test(data.mobile))return toast('Fill complete valid address and mobile');try{await API.call('/user/addresses',{method:'POST',body:JSON.stringify(data)});toast('Address added');wrap.remove();load()}catch(e){toast(e.message)}}}
async function setDefaultAddress(id){try{await API.call('/user/addresses/'+id+'/default',{method:'PATCH'});toast('Default address updated');load()}catch(e){toast(e.message)}}
async function delAddress(id){if(!confirm('Delete this address?'))return;await API.call('/user/addresses/'+id,{method:'DELETE'});load()}async function redeemGift(){try{const d=await API.call('/advanced/gift-cards/redeem',{method:'POST',body:JSON.stringify({code:giftCode.value.trim()})});toast('Credited '+money(d.credited));load()}catch(e){toast(e.message)}}async function redeemPoints(){try{const d=await API.call('/advanced/wallet/redeem-points',{method:'POST',body:JSON.stringify({points:+points.value})});toast('Wallet credited '+money(d.credited));load()}catch(e){toast(e.message)}}async function markRead(){await API.call('/commerce/notifications/read',{method:'PATCH'});load()}
</script></body></html>
