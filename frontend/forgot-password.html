<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password | ShopVerse</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/api.js"></script><script defer src="/js/common.js"></script></head><body><div id="siteHeader"></div><main class="page"><div class="panel authbox"><h1>Forgot Password</h1><p class="muted">Enter your registered email address. We will send a 6-digit OTP to your email.</p><label class="field">Registered email<input id="identifier" type="email" autocomplete="email" placeholder="name@example.com" required></label><button id="send" class="btn secondary" style="width:100%">Send Email OTP</button><div id="sentTo" class="muted" style="margin:10px 0"></div><label class="field">6-digit OTP<input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Enter OTP"></label><label class="field">New password<input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="Minimum 6 characters"></label><button id="reset" class="btn brand" style="width:100%">Reset Password</button><p class="muted" style="margin-top:12px">OTP expires in 10 minutes. You can request another OTP after 60 seconds.</p></div></main><script>
let cooldown=0,timer;function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}function runCooldown(){cooldown=60;send.disabled=true;clearInterval(timer);timer=setInterval(()=>{cooldown--;send.textContent=cooldown?`Resend in ${cooldown}s`:'Send Email OTP';if(!cooldown){clearInterval(timer);send.disabled=false}},1000)}
send.onclick=async()=>{const email=identifier.value.trim().toLowerCase();if(!validEmail(email))return toast('Enter a valid registered email');const old=send.textContent;send.disabled=true;send.textContent='Sending...';try{const d=await API.call('/auth/forgot-password',{method:'POST',body:JSON.stringify({email})});toast(d.message);sentTo.textContent=d.maskedEmail?`OTP sent to ${d.maskedEmail}`:'';runCooldown()}catch(e){toast(e.message);send.disabled=false;send.textContent=old}};
reset.onclick=async()=>{const email=identifier.value.trim().toLowerCase(),code=otp.value.trim();if(!validEmail(email)||!/^[0-9]{6}$/.test(code))return toast('Enter registered email and valid 6-digit OTP');if(password.value.length<6)return toast('New password must be at least 6 characters');try{await API.call('/auth/reset-password',{method:'POST',body:JSON.stringify({email,otp:code,password:password.value})});toast('Password changed successfully');setTimeout(()=>location.href='/login.html',800)}catch(e){toast(e.message)}};
otp.oninput=()=>otp.value=otp.value.replace(/\D/g,'').slice(0,6);
</script><div class="toast"></div></body></html>
