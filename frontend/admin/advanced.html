<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Operations | ShopVerse</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/api.js"></script><script defer src="/js/common.js"></script></head><body><div id="siteHeader"></div><main class="page"><div class="panel"><h1>Advanced Operations</h1><p class="muted">Flash sales, gift cards, refunds, search analytics, audit logs and image uploads.</p><div class="chips"><button class="btn secondary" onclick="setShopVerseTheme('light')">Light</button><button class="btn secondary" onclick="setShopVerseTheme('dark')">Dark</button><button class="btn secondary" onclick="setShopVerseTheme('system')">System</button></div></div><div class="grid2" style="margin-top:16px"><div class="panel"><h2>Gift Cards</h2><form id="gift"><input id="gcode" placeholder="Code (optional)"><input id="gbal" type="number" placeholder="Balance" required><button class="btn brand">Create</button></form><div id="gifts"></div></div><div class="panel"><h2>Flash Sale</h2><form id="flash"><input id="fname" placeholder="Sale name" required><input id="fstart" type="datetime-local" required><input id="fend" type="datetime-local" required><button class="btn brand">Create</button></form><div id="flashes"></div></div><div class="panel"><h2>Image Manager</h2><input id="imgs" type="file" accept="image/jpeg,image/png,image/webp,image/avif" multiple><button class="btn brand" onclick="uploadImages()">Upload</button><div id="uploaded" class="muted"></div></div><div class="panel"><h2>Search Analytics</h2><div id="searches"></div></div><div class="panel wide"><h2>Refunds</h2><div id="refunds"></div></div><div class="panel wide"><h2>Audit Log</h2><div id="audit"></div></div></div></main><script>
document.addEventListener('DOMContentLoaded',load);async function load(){if(!API.token)return location.href='/login.html?next=/admin/advanced.html';try{const[g,f,s,r,a]=await Promise.all([API.call('/advanced/admin/gift-cards'),API.call('/advanced/admin/flash-sales'),API.call('/advanced/admin/search-analytics'),API.call('/advanced/admin/refunds'),API.call('/advanced/admin/audit')]);gifts.innerHTML=g.map(x=>`<p><b>${x.code}</b> · ${money(x.balance)} / ${money(x.initialBalance)}</p>`).join('')||'<p>No gift cards.</p>';flashes.innerHTML=f.map(x=>`<p><b>${x.name}</b> · ${new Date(x.startAt).toLocaleString()} → ${new Date(x.endAt).toLocaleString()}</p>`).join('')||'<p>No flash sales.</p>';searches.innerHTML=s.map(x=>`<p>${x._id}: <b>${x.searches}</b> searches · ${x.zero} zero-result</p>`).join('')||'<p>No search data.</p>';refunds.innerHTML=r.map(x=>`<p>${x.order?.orderNumber||''} · ${money(x.amount)} · ${x.status}</p>`).join('')||'<p>No refunds.</p>';audit.innerHTML=a.slice(0,100).map(x=>`<p><b>${x.action}</b> · ${x.actor?.email||'system'} · ${new Date(x.createdAt).toLocaleString()}</p>`).join('')||'<p>No audit logs.</p>'}catch(e){toast(e.message)}}
gift.onsubmit=async e=>{e.preventDefault();await API.call('/advanced/admin/gift-cards',{method:'POST',body:JSON.stringify({code:gcode.value,balance:+gbal.value})});gift.reset();load()};flash.onsubmit=async e=>{e.preventDefault();await API.call('/advanced/admin/flash-sales',{method:'POST',body:JSON.stringify({name:fname.value,startAt:new Date(fstart.value),endAt:new Date(fend.value),products:[],active:true})});flash.reset();load()};async function uploadImages(){const fd=new FormData();[...imgs.files].forEach(x=>fd.append('images',x));const r=await fetch('/api/uploads/images',{method:'POST',headers:{Authorization:'Bearer '+API.token},body:fd});const d=await r.json();if(!r.ok)return toast(d.message||'Upload failed');uploaded.innerHTML=d.files.map(x=>`<div><input value="${x.url}" readonly style="width:80%"></div>`).join('');}
</script><div class="toast"></div></body></html>
