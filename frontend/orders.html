<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | ShopVerse</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/customer.css"><script defer src="/js/api.js"></script><script defer src="/js/common.js"></script></head><body><div id="siteHeader"></div><main class="customer-shell"><div class="customer-head"><div><span class="eyebrow">YOUR SHOPPING</span><h1>My Orders</h1><p class="muted">Track orders, view products, download invoices and chat with support.</p></div><a class="btn secondary" href="/products.html">Continue shopping</a></div><div id="orders" class="orders-list"></div></main><div class="toast"></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.addEventListener('DOMContentLoaded',async()=>{if(!API.token)return location.href='/login.html';const v=new URLSearchParams(location.search).get('verify');if(v){try{await API.call('/orders/verify/'+v);history.replaceState({},'', '/orders.html')}catch(e){toast(e.message)}}load()});async function load(){try{const d=await API.call('/orders');orders.innerHTML=d.length?d.map(o=>`<article class="order-card"><div class="order-card-head"><div><span class="muted">Order</span><b>${esc(o.orderNumber)}</b><small>${new Date(o.createdAt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</small></div><div class="order-total"><span class="status-pill">${esc(o.status)}</span><strong>${money(o.total)}</strong></div></div><div class="order-products-preview">${o.items.slice(0,3).map(x=>`<div class="preview-item"><div class="preview-thumb">${esc((x.name||'P')[0])}</div><div><b>${esc(x.name)}</b><span>Qty ${x.qty} · ${money(x.price)}</span></div></div>`).join('')}${o.items.length>3?`<div class="more-items">+${o.items.length-3} more</div>`:''}</div><div class="order-actions"><a class="btn brand" href="/order-details.html?id=${o._id}">View order</a><a class="btn secondary" href="/order-chat.html?order=${o._id}">💬 Chat about order</a><button class="btn secondary" onclick="reorder('${o._id}')">Reorder</button>${['Delivered','Confirmed','Shipped','Out for Delivery'].includes(o.status)?`<button class="btn secondary" onclick="requestReturn('${o._id}')">Return / Replace</button>`:''}</div></article>`).join(''):'<div class="premium-card empty-state"><h2>No orders yet</h2><p>Products you order will appear here with their status and support chat.</p><a class="btn brand" href="/products.html">Start shopping</a></div>'}catch(e){toast(e.message)}}async function reorder(id){try{await API.call('/advanced/orders/'+id+'/reorder',{method:'POST'});toast('Available items added to cart')}catch(e){toast(e.message)}}async function requestReturn(id){const type=confirm('OK = Return, Cancel = Replacement')?'RETURN':'REPLACE';const reason=prompt('Reason for '+type.toLowerCase());if(!reason)return;try{await API.call('/commerce/returns',{method:'POST',body:JSON.stringify({orderId:id,type,reason})});toast('Request submitted');load()}catch(e){toast(e.message)}}
</script></body></html>
