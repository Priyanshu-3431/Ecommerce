<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compare | ShopVerse</title><link rel="stylesheet" href="/css/style.css"><script defer src="/js/api.js"></script><script defer src="/js/common.js"></script></head><body><div id="siteHeader"></div><main class="page"><div class="panel"><div class="section-head"><h1>Compare Products</h1><button class="btn secondary" onclick="localStorage.removeItem('sv_compare');load()">Clear</button></div><div id="cmp" style="overflow:auto"></div></div></main><script>async function load(){const ids=JSON.parse(localStorage.getItem('sv_compare')||'[]');if(!ids.length){cmp.innerHTML='<p class="muted">Use Compare button on products to add up to 4 products.</p>';return}const all=(await API.call('/products?limit=60')).items;const p=ids.map(id=>all.find(x=>x._id===id)).filter(Boolean);cmp.innerHTML=`<table class="table"><tr><th>Feature</th>${p.map(x=>`<th><img src="${x.images.main}" style="width:120px;border-radius:12px"><br>${x.name}</th>`).join('')}</tr><tr><td>Price</td>${p.map(x=>`<td>${money(x.price)}</td>`).join('')}</tr><tr><td>Brand</td>${p.map(x=>`<td>${x.brand}</td>`).join('')}</tr><tr><td>Rating</td>${p.map(x=>`<td>⭐ ${x.rating}</td>`).join('')}</tr><tr><td>Stock</td>${p.map(x=>`<td>${x.stock}</td>`).join('')}</tr><tr><td>Warranty</td>${p.map(x=>`<td>${x.warranty||'-'}</td>`).join('')}</tr><tr><td>360</td>${p.map(x=>`<td>${x.images.spin360?.length?'Yes':'No'}</td>`).join('')}</tr></table>`}document.addEventListener('DOMContentLoaded',load)</script><div class="toast"></div></body></html>
